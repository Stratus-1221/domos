<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>Domos</title>
<meta name="description" content="A graphing calculator built for phones.">
<meta name="theme-color" content="#fcfdff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout concept: graph paper fills the screen; expressions live in a draggable sheet below it (side column on wide screens); a math keyboard docks under the sheet. */
:root {
  --paper: #fcfdff; --panel: #eef2f6; --raise: #ffffff; --gutter: #f5f7fa; --focus: #e7f4f2;
  --ink: #17202b; --ink2: #5a6576; --line: #dbe1e8; --accent: #0d8478; --accent-ink: #ffffff; --danger: #b6382d;
  --kbd: #cdd4dd; --key: #ffffff; --key2: #e2e7ed; --key3: #0d8478; --key3-ink: #ffffff; --shadow: 0 1px 3px rgba(20,30,45,.14), 0 4px 14px rgba(20,30,45,.08);
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --math: "STIX Two Text", "Cambria Math", "Latin Modern Roman", "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1015; --panel: #131820; --raise: #171d26; --gutter: #12171e; --focus: #13302d;
    --ink: #e5e9ef; --ink2: #96a1b2; --line: #252d39; --accent: #3cc6b7; --accent-ink: #04201d; --danger: #ff7b6f;
    --kbd: #090c10; --key: #252c37; --key2: #1a2028; --key3: #2f9c90; --key3-ink: #04201d; --shadow: 0 1px 3px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1015; --panel: #131820; --raise: #171d26; --gutter: #12171e; --focus: #13302d;
  --ink: #e5e9ef; --ink2: #96a1b2; --line: #252d39; --accent: #3cc6b7; --accent-ink: #04201d; --danger: #ff7b6f;
  --kbd: #090c10; --key: #252c37; --key2: #1a2028; --key3: #2f9c90; --key3-ink: #04201d; --shadow: 0 1px 3px rgba(0,0,0,.5), 0 4px 16px rgba(0,0,0,.35);
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 15px; overflow: hidden;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:not(.src):focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }

[hidden] { display: none !important; }
#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; grid-template-areas: "stage" "panel" "kbd"; }
#stage { grid-area: stage; position: relative; overflow: hidden; background: var(--paper); min-height: 0; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.fab { position: absolute; top: 12px; display: flex; flex-direction: column; gap: 10px; z-index: 2; }
.fab.tl { left: 12px; } .fab.tr { right: 12px; align-items: flex-end; }
.fbtn { width: 44px; height: 44px; border-radius: 12px; background: var(--raise); color: var(--ink); box-shadow: var(--shadow); display: grid; place-items: center; }
.zoomgrp { display: flex; flex-direction: column; background: var(--raise); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.zoomgrp button { width: 44px; height: 42px; display: grid; place-items: center; }
.zoomgrp button + button { border-top: 1px solid var(--line); }
.fbtn:active, .zoomgrp button:active { background: var(--key2); }

#panel { grid-area: panel; display: flex; flex-direction: column; background: var(--raise); border-top: 1px solid var(--line);
  box-shadow: 0 -6px 18px rgba(10,20,30,.07); min-height: 0; height: 46vh; position: relative; z-index: 3; }
#grip { height: 18px; display: grid; place-items: center; cursor: ns-resize; touch-action: none; flex: none; }
#grip span { width: 40px; height: 4px; border-radius: 3px; background: var(--line); }
#phead { display: flex; align-items: center; gap: 4px; padding: 0 12px 8px; flex: none; touch-action: none; }
.hbtn { height: 38px; min-width: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink); }
.hbtn:disabled { opacity: .35; cursor: default; }
.hbtn:not(:disabled):active { background: var(--key2); }
.hbtn.add { background: var(--accent); color: var(--accent-ink); width: 38px; }
#gTitle { flex: 1; min-width: 0; text-align: center; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; color: var(--ink); }
#bDone { padding: 0 14px; background: var(--key2); font-weight: 600; font-size: 14px; }
#bKbd.on { color: var(--accent); }

#list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; border-top: 1px solid var(--line); background: var(--panel); }
.row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; background: var(--raise); border-bottom: 1px solid var(--line); min-height: 58px; }
.row.editing { background: var(--focus); }
.row.editing .gut { background: transparent; }
.gut { background: var(--gutter); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 6px; }
.idx { font-size: 11px; color: var(--ink2); font-variant-numeric: tabular-nums; line-height: 1; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--c, var(--ink2)); background: var(--c, transparent); position: relative; touch-action: none; }
.sw.off { background: transparent; }
.sw.pt::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--raise); }
.sw.pt.off::after { background: var(--c); inset: 6px; }
.sw[hidden] { display: none !important; }
.qt { font-family: var(--math); font-size: 28px; line-height: .8; color: var(--ink2); }
.ticon { width: 22px; height: 22px; color: var(--ink2); }

.main { min-width: 0; display: flex; flex-direction: column; }
.field { position: relative; padding: 15px 6px 13px 12px; font-family: var(--math); font-size: 21px; line-height: 1.35; min-height: 30px; }
.src { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; border: 0; margin: 0; padding: 15px 6px 13px 12px; background: transparent;
  color: transparent; caret-color: transparent; font: inherit; outline: none; opacity: 0; }
.row.editing .src { pointer-events: none; }
.row.editing .pretty { display: none; }
.live { display: none; min-height: 28px; overflow-wrap: anywhere; cursor: text; color: var(--ink); user-select: none; -webkit-user-select: none; }
.row.editing .live { display: block; }
.mv .c.v { font-style: italic; }
.mv .c.op { margin: 0 .22em; }
.mv .c.rel { margin: 0 .32em; }
.mv .c.cm { margin-right: .22em; }
.mv .c.sl2 { margin: 0 .06em; }
.mv .fw { margin-right: 1px; }
.mv .sl { background: color-mix(in srgb, var(--accent) 30%, transparent); }
.mv .caret { display: inline-block; width: 0; height: 1.15em; border-left: 2px solid var(--accent); margin-right: -2px; vertical-align: -.22em; animation: blink 1.06s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.mv .bx { border-radius: 3px; padding: 0 .05em; }
.mv .bx.em { display: inline-block; min-width: .55em; height: .8em; border: 1.2px dashed color-mix(in srgb, var(--ink2) 70%, transparent); vertical-align: .55em; line-height: 0; box-sizing: border-box; }
.mv sub.bx.em { vertical-align: -.35em; }
.mv .bx:has(.caret) { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.mv sup .caret, .mv sub .caret { height: .95em; vertical-align: -.12em; }
.mv .bx.em .caret { height: .7em; vertical-align: 0; margin-left: .2em; }
.pretty { min-height: 28px; overflow-wrap: anywhere; color: var(--ink); }
.pretty:empty::before { content: attr(data-ph); color: var(--ink2); opacity: .6; font-family: var(--ui); font-size: 15px; }
.mv i { font-style: italic; }
.mv .mf { font-style: normal; margin-right: 1px; }
.mv .mg { font-style: italic; }
.mv .mo { margin: 0 .22em; }
.mv .mo.u { margin: 0 .05em 0 0; }
.mv .mo.rel { margin: 0 .32em; }
.mv sup { font-size: .68em; vertical-align: .62em; line-height: 0; }
.mv sub { font-size: .66em; vertical-align: -.25em; line-height: 0; }
.mv .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .12em; font-size: .9em; }
.mv .fr > .fn { padding: 0 .15em .06em; border-bottom: 1.5px solid currentColor; }
.mv .fr > .fd { padding: .06em .15em 0; }
.mv .rad { display: inline-block; position: relative; margin: 0 .06em; padding-left: .6em; }
.mv .rad > .rs { position: absolute; left: 0; top: 0; bottom: 0; width: .62em; height: 100%; overflow: visible; display: block; }
.mv .rs path { fill: none; stroke: currentColor; stroke-width: 1.5px; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.mv .ri { display: inline-block; border-top: 1.5px solid currentColor; padding: .1em .12em 0 .08em; }
.mv .ri.em { min-width: .7em; }
.mv .ri.em:not(:has(.caret))::after { content: ""; display: inline-block; width: .5em; height: .8em; border: 1.2px dashed color-mix(in srgb, var(--ink2) 70%, transparent); border-radius: 2px; vertical-align: -.1em; }
.mv .ri:has(.caret) { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.mv .rad.cube::before { content: "3"; position: absolute; left: 0; top: .05em; font-size: .5em; }
.mv .big { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; margin-right: .15em; }
.mv .bs { font-size: 1.35em; line-height: 1; }
.mv .bh, .pretty .bl { font-size: .6em; }
.mv .br { font-size: 1.15em; }
.mv .raw { font-family: var(--ui); font-size: 16px; color: var(--ink); }

.ext { display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px 12px; font-size: 14px; }
.ext:empty { display: none; }
.val.tap { cursor: pointer; color: var(--ink); text-align: right; }
.val.tap:active { background: var(--key2); }
.val .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; margin-left: .1em; line-height: 1.15; }
.val .fr > .fn { border-bottom: 1.5px solid currentColor; padding: 0 .15em; }
.val .fr > .fd { padding: 0 .15em; }
.val { align-self: flex-end; font-family: var(--math); font-size: 19px; background: var(--gutter); border: 1px solid var(--line); border-radius: 8px; padding: 2px 10px; max-width: 100%; overflow-x: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
.err { display: flex; gap: 8px; align-items: flex-start; color: var(--danger); line-height: 1.35; }
.err svg { flex: none; width: 16px; height: 16px; margin-top: 1px; stroke: currentColor; fill: none; stroke-width: 2; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.chip i { font-family: var(--math); font-size: 15px; }
.sld { display: grid; grid-template-columns: 32px 54px minmax(0, 1fr) 54px; align-items: center; gap: 8px; }
.play { width: 32px; height: 32px; border-radius: 50%; background: var(--key2); display: grid; place-items: center; color: var(--ink); }
.play.on { background: var(--accent); color: var(--accent-ink); }
.play svg { width: 14px; height: 14px; fill: currentColor; stroke: none; }
.lim, .dom input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--raise); color: var(--ink); border-radius: 7px; padding: 5px 4px; font-family: var(--math); font-size: 15px; text-align: center; font-variant-numeric: tabular-nums; }
.lim:focus, .dom input:focus { border-color: var(--accent); outline: none; }
input[type=range].rng { width: 100%; margin: 0; accent-color: var(--accent); height: 28px; background: transparent; }
.dom { display: flex; align-items: center; gap: 8px; font-family: var(--math); font-size: 17px; color: var(--ink2); }
.dom input { width: 74px; }
.reg { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--math); font-size: 17px; }
.reg .k { color: var(--ink2); }
.reg .r2 { color: var(--ink2); }

.acts { display: none; flex-direction: column; justify-content: flex-start; padding: 8px 6px 0 0; gap: 2px; }
.row.editing .acts { display: flex; }
@media (hover: hover) { .row:hover .acts { display: flex; } }
.acts button { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--ink2); }
.acts button:active { background: var(--key2); }

.ntx { width: 100%; box-sizing: border-box; border: 0; resize: none; background: transparent; color: var(--ink); font: 15px/1.45 var(--ui); padding: 16px 8px 14px 12px; outline: none; overflow: hidden; }
.ntx::placeholder { color: var(--ink2); }

.tblwrap { overflow-x: auto; padding: 10px 6px 10px 12px; }
.tbl { border-collapse: separate; border-spacing: 0; font-family: var(--math); }
.tbl th, .tbl td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; min-width: 84px; }
.tbl tr > :first-child { border-left: 1px solid var(--line); }
.tbl th { border-top: 1px solid var(--line); background: var(--gutter); }
.tbl input { width: 84px; box-sizing: border-box; border: 0; background: transparent; color: var(--ink); font: 17px var(--math); padding: 7px 8px; text-align: center; outline: none; font-variant-numeric: tabular-nums; }
.tbl input:focus { background: var(--focus); }
.tbl input[readonly] { color: var(--ink2); }
.th { display: flex; align-items: center; gap: 2px; padding-left: 6px; }
.th .sw { width: 18px; height: 18px; border-width: 2.5px; flex: none; }
.th input { font-weight: 500; }
.tbl .cerr { font: 12px/1.3 var(--ui); color: var(--danger); padding: 4px 6px; max-width: 120px; white-space: normal; }
.tadd { margin: 0 12px 10px; font-size: 13px; font-weight: 600; color: var(--accent); padding: 6px 0; }

/* keyboard */
#kbd { grid-area: kbd; background: var(--kbd); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); user-select: none; -webkit-user-select: none; touch-action: manipulation; z-index: 4; }
#kbd[hidden] { display: none !important; }
.krow { display: flex; gap: 5px; margin-bottom: 5px; }
.krow:last-child { margin-bottom: 0; }
.key { flex: 1 1 0; min-width: 0; height: 44px; border-radius: 8px; background: var(--key); color: var(--ink); display: grid; place-items: center;
  font-family: var(--math); font-size: 20px; box-shadow: 0 1px 0 rgba(0,0,0,.18); line-height: 1; touch-action: manipulation; }
.key.alt { background: var(--key2); }
.key.go { background: var(--key3); color: var(--key3-ink); }
.key.ui { font-family: var(--ui); font-size: 14px; font-weight: 500; }
.key.sm { font-size: 15px; }
.key.down, .key:active { filter: brightness(.88); }
.key sup { font-size: .6em; vertical-align: .6em; line-height: 0; }
.key sub { font-size: .6em; vertical-align: -.3em; line-height: 0; }
.key i { font-style: italic; }
.key > span { display: inline-block; white-space: nowrap; }
.mv .pr { margin-left: .1em; }
.mv .ts { display: inline-block; width: .17em; }
.key svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.kpage.func .key { height: 36px; font-size: 16px; }
.kpage.abc .key { font-family: var(--ui); font-size: 18px; }
.gap { flex: .25 1 0; }

/* drawers and popovers */
#scrim { position: fixed; inset: 0; background: rgba(8,12,18,.38); z-index: 20; }
#scrim[hidden] { display: none; }
.drawer { position: fixed; top: 0; bottom: 0; width: min(360px, 88vw); background: var(--raise); z-index: 21; display: flex; flex-direction: column;
  transition: transform .22s ease; box-shadow: var(--shadow); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer.l { left: 0; transform: translateX(-104%); } .drawer.r { right: 0; transform: translateX(104%); }
.drawer.open { transform: none; }
.dhead { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.dhead h2 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; letter-spacing: -.01em; }
.dbody { flex: 1; overflow-y: auto; padding: 8px 16px 24px; }
.sec { padding: 14px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.gitem { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 11px 10px; border-radius: 10px; }
.gitem:active { background: var(--key2); }
.gitem.cur { background: var(--focus); }
.gitem .gt { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gitem .gd { font-size: 12px; color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.gitem .gm { font-family: var(--math); font-size: 14px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; font-weight: 400; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 16px; border-radius: 10px; background: var(--key2); font-weight: 600; font-size: 14px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.warn { color: var(--danger); }
.btn.full { width: 100%; }
.titlein { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: 600 16px var(--ui); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--key2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { height: 36px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ink2); }
.seg button.on { background: var(--key); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tog { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 15px; text-align: left; }
.tog .knob { width: 42px; height: 26px; border-radius: 13px; background: var(--key2); position: relative; flex: none; transition: background .15s; }
.tog .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.tog[aria-checked="true"] .knob { background: var(--accent); }
.tog[aria-checked="true"] .knob::after { transform: translateX(16px); }
.vp { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px 8px; align-items: center; font-family: var(--math); font-size: 16px; }
.vp input { width: 100%; min-width: 0; box-sizing: border-box; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; padding: 8px; font: 15px var(--math); text-align: center; }
.row2 { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.note { font-size: 13px; color: var(--ink2); line-height: 1.45; margin: 8px 0 0; }
textarea.code { width: 100%; box-sizing: border-box; min-height: 80px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; padding: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace; resize: vertical; }

#pop { position: fixed; z-index: 30; background: var(--raise); border-radius: 14px; box-shadow: var(--shadow), 0 0 0 1px var(--line); padding: 12px; width: 260px; max-width: calc(100vw - 32px); }
#pop[hidden] { display: none; }
#pop .plab { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); margin: 2px 0 8px; }
.colors { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 12px; }
.colors button { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--c); border: 3px solid var(--raise); box-shadow: 0 0 0 2px transparent; }
.colors button.on { box-shadow: 0 0 0 2px var(--c); }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.opts button { height: 38px; border-radius: 9px; background: var(--key2); display: grid; place-items: center; color: var(--ink2); }
.opts button.on { background: var(--focus); color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.opts svg { width: 46px; height: 12px; }
.menu button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 8px; border-radius: 9px; font-size: 15px; font-weight: 500; text-align: left; }
.menu button:active { background: var(--key2); }
.menu .mi { width: 28px; text-align: center; font-family: var(--math); font-size: 19px; color: var(--accent); }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;

/* ---------------- regression ---------------- */

function solveLin(A, b) {

function runReg(M, reg) {

    const st = reg.st, params = reg.params;

    const lc = M.top(st.terms[0]);
    if (lc.uses.size) throw new MathError('Regressions fit lists, like y₁ ~ m x₁ + b');
    const yv = lc.c(mkEnv(), []);
    if (isNum(yv)) throw new MathError('The left side should be a list, like y₁');
    const Lp = new Map(params.map((p, i) => [p, i])), info = newInfo();
    const rf = M.compile(st.terms[1], Lp, info);

    if (info.uses.size) throw new MathError('Use lists instead of x, like y₁ ~ m x₁ + b');

      const rv = rf(env, p.slice());

        if (!isFinite(yv[i])) continue;

    if (resid(params.map(() => 1)).length < 1) throw new MathError('Add some data first');
    const p = levenberg(resid, params.map(() => 1));
    const ys = yv.filter(v => isFinite(v)), mean = ys.reduce((s, v) => s + v, 0) / ys.length;

}

/* ---------------- analyzer ---------------- */
function defOf(st) {
  if (st.kind !== 'rel' || st.ops.length !== 1 || st.ops[0] !== '=') return null;
  const L = st.terms[0];
  if (L.t === 'id' && !['x', 'y', 'r', 'pi', 'tau', 'e', 'inf', 'theta'].includes(L.name)) return { kind: 'var', name: L.name };
  if (L.t === 'ucall' && !L.primes && !['x', 'y', 'r'].includes(L.name) && L.args.length && L.args.every(a => a.t === 'id'))
    return { kind: 'fn', name: L.name, params: L.args.map(a => a.name) };
  return null;
}
const isId = (n, name) => n.t === 'id' && n.name === name;
const only = (uses, allowed) => [...uses].every(u => allowed.includes(u));
const FLIP = { '<': '>', '>': '<', '<=': '>=', '>=': '<=', '=': '=' };

function badFree(uses, allowed, ctx) {
  const bad = [...uses].filter(u => !allowed.includes(u));
  if (!bad.length) return;
  const slider = bad.filter(u => u === 't' || u === 'th' || u === 'r');
  const names = bad.map(u => FREE_DISP[u]).join(' and ');
  if (slider.length === bad.length)
    throw new MathError(`${names} only ${bad.length > 1 ? 'work' : 'works'} in ${ctx || 'parametric or polar graphs'} here`, { missing: slider.map(u => FREE_NAME[u]) });
  throw new MathError(`Can't mix ${[...uses].map(u => FREE_DISP[u]).join(' and ')} here`);
}

function mk1(c, key) { const env = mkEnv(), fr = []; return v => { env[key] = v; return c(env, fr); }; }

function analyze(items, opts) {
  opts = opts || {};
  const deg = !!opts.deg;
  const M = new Model(deg);
  const P = new Map(), out = new Map();
  for (const it of items) {
    if (it.type === 'expr') {
      const txt = (it.text || '').trim();
      if (!txt) { P.set(it.id, { empty: true }); continue; }
      try {
        const st = parseCached(txt); P.set(it.id, { st });
        const d = defOf(st);
        if (d) M.addDef(d.name, Object.assign(d, { item: it, st }));
      } catch (e) { P.set(it.id, { err: e }); }
    } else if (it.type === 'table') {
      it.columns.forEach((c, k) => {
        try {
          const st = parseCached((c.header || '').trim() || '?');
          if (st.kind === 'expr' && st.terms[0].t === 'id' && !RESERVED.has(st.terms[0].name))
            M.addDef(st.terms[0].name, { kind: 'list', item: it, col: k, cells: c.values });
        } catch (e) { /* reported below */ }
      });
    }
  }
  for (const it of items) {
    const p = P.get(it.id);
    if (!p || !p.st || p.st.kind !== 'rel' || !p.st.ops.includes('~')) continue;
    if (p.st.ops.length !== 1) continue;
    const ids = new Set(); collectIds(p.st.terms[1], ids, new Set(), M);
    const params = [...ids].filter(nm => !M.defs.has(nm) && !RESERVED.has(nm));
    const reg = { item: it, st: p.st, params, out: null };
    p.reg = reg;
    params.forEach(nm => M.addDef(nm, { kind: 'regparam', reg, item: it }));
  }

  const domain = (it, key, dflt) => {
    const d = (it.domain || {})[key];
    if (d == null || String(d).trim() === '') return dflt;
    try {
      const st = parseCached(String(d));
      if (st.kind !== 'expr') return dflt;
      const c = M.top(st.terms[0]);
      if (c.uses.size) return dflt;
      const v = c.c(mkEnv(), []);
      return isNum(v) && isFinite(v) ? v : dflt;
    } catch (e) { return dflt; }
  };

  function graph(draws, extra) { return Object.assign({ kind: 'graph', draws }, extra || {}); }
  function fx(c, op) { return graph([{ type: 'fx', op, f: mk1(c.c, 'x') }]); }
  function fy(c, op) { return graph([{ type: 'fy', op, f: mk1(c.c, 'y') }]); }

    const t0 = domain(it, 'min', 0), t1 = domain(it, 'max', deg ? 360 : 2 * Math.PI);

      const env = mkEnv(), fr = [];

        let th = Math.atan2(y, x); if (th < 0) th += 2 * Math.PI; if (deg) th *= 180 / Math.PI;
        const r = Math.hypot(x, y); env.th = th;
        const rv = c.c(env, fr); return isNum(rv) ? r - rv : SUB(r, rv);

    }
    return graph([{ type: 'polar', f: mk1(c.c, 'th'), t0, t1, deg }], { domainVar: 'θ', domain: [t0, t1] });
  }
  function implicitF(cs, needPolar) {
    const env = mkEnv(), fr = [];
    return cs.map(c => (x, y) => {
      env.x = x; env.y = y;
      if (needPolar) { env.r = Math.hypot(x, y); let th = Math.atan2(y, x); if (th < 0) th += 2 * Math.PI; env.th = deg ? th * 180 / Math.PI : th; }
      return c.c(env, fr);

  }
  function dragFor(n) {
    if (numLiteral(n) !== null) return { lit: true };
    if (n.t === 'id' && M.isSlider(n.name)) return { v: n.name };
    return null;
  }
  function points(it, e) {
    if (e.items.length !== 2) throw new MathError('Points need two coordinates, like (1, 2)');
    const a = M.top(e.items[0]), b = M.top(e.items[1]);
    const uses = new Set([...a.uses, ...b.uses]);
    if (!uses.size) {
      const xv = a.c(mkEnv(), []), yv = b.c(mkEnv(), []);
      const pts = [];
      if (isNum(xv) && isNum(yv)) pts.push([xv, yv]);
      else {
        const n = Math.min(isNum(xv) ? Infinity : xv.length, isNum(yv) ? Infinity : yv.length);
        for (let k = 0; k < n; k++) pts.push([isNum(xv) ? xv : xv[k], isNum(yv) ? yv : yv[k]]);
      }
      let drag = null;
      if (pts.length === 1) { const dx = dragFor(e.items[0]), dy = dragFor(e.items[1]); if (dx && dy && !(dx.lit && dy.lit && false)) drag = { x: dx, y: dy }; }
      return graph([{ type: 'points', pts, drag }], pts.length === 1 ? { point: pts[0] } : null);
    }
    if (only(uses, ['t'])) {
      const t0 = domain(it, 'min', 0), t1 = domain(it, 'max', 1);
      const env = mkEnv(), fr = [];
      const f = t => { env.t = t; const x = a.c(env, fr), y = b.c(env, fr); return [isNum(x) ? x : NaN, isNum(y) ? y : NaN]; };
      return graph([{ type: 'param', f, t0, t1 }], { domainVar: 't', domain: [t0, t1] });

  }

    const st = p.st;
    if (st.kind === 'empty') return { kind: 'empty' };
    const def = defOf(st);
    if (def) {
      const d = M.defs.get(def.name);
      if (d.kind === 'dup') throw new MathError(`${disp(def.name)} is defined more than once`);
      if (def.kind === 'var') {
        const v = M.getVar(def.name);
        if (numLiteral(st.terms[1]) !== null && isNum(v)) return { kind: 'slider', name: def.name, value: v };
        return { kind: 'var', name: def.name, value: fmtNum(v), raw: v };
      }
      const fd = M.getFn(def.name);
      if (def.params.length === 1 && def.params[0] === 'x' && fd.uses.size === 0) {
        const env = mkEnv(), body = fd.body, fr = [0];

      }

    }
    if (st.kind === 'rel') {
      const ops = st.ops;
      if (ops.includes('~')) {
        if (ops.length !== 1) throw new MathError('A regression has one ~, like y₁ ~ m x₁ + b');
        const o = runReg(M, p.reg);
        if (o.err) throw o.err;
        return graph(o.f ? [{ type: 'fx', op: '=', f: o.f }] : [], { kind: 'regression', params: o.params, r2: o.r2 });
      }
      if (ops.length === 1) {
        const op = ops[0], [Ln, Rn] = st.terms;
        if (Ln.t === 'tuple' || Rn.t === 'tuple') throw new MathError('Points can only be plotted on their own line');
        const lc = M.top(Ln), rc = M.top(Rn);
        if (isId(Ln, 'y') && only(rc.uses, ['x'])) return fx(rc, op);
        if (isId(Rn, 'y') && only(lc.uses, ['x'])) return fx(lc, FLIP[op]);
        if (isId(Ln, 'x') && only(rc.uses, ['y'])) return fy(rc, op);
        if (isId(Rn, 'x') && only(lc.uses, ['y'])) return fy(lc, FLIP[op]);
        if (isId(Ln, 'r') && only(rc.uses, ['th'])) return polar(it, rc, op);
        if (isId(Rn, 'r') && only(lc.uses, ['th'])) return polar(it, lc, FLIP[op]);

        if (!uses.size) {
          const a = lc.c(mkEnv(), []), b = rc.c(mkEnv(), []);

        }

      if (st.terms.some(t => t.t === 'tuple')) throw new MathError('Points can only be plotted on their own line');
      const cs = st.terms.map(t => M.top(t));
      const uses = new Set(); cs.forEach(c => c.uses.forEach(u => uses.add(u)));
      badFree(uses, ['x', 'y', 'r', 'th'], 'parametric curves');
      if (!uses.size) throw new MathError('Nothing to graph here');

    }
    const e = st.terms[0];
    if (e.t === 'tuple') return points(it, e);
    if (e.t === 'list' && e.items.length && e.items.every(n => n.t === 'tuple')) {
      const pts = [];
      for (const tp of e.items) {
        if (tp.items.length !== 2) throw new MathError('Points need two coordinates, like (1, 2)');
        const a = M.top(tp.items[0]), b = M.top(tp.items[1]);
        if (a.uses.size || b.uses.size) throw new MathError('Points in a list need fixed numbers');
        const xv = a.c(mkEnv(), []), yv = b.c(mkEnv(), []);
        if (isNum(xv) && isNum(yv)) pts.push([xv, yv]);
      }
      return graph([{ type: 'points', pts }]);
    }
    const c = M.top(e);
    if (!c.uses.size) {
      const v = c.c(mkEnv(), []);
      return { kind: 'value', value: fmtNum(v), raw: v };
    }
    if (only(c.uses, ['x'])) return fx(c, '=');
    if (only(c.uses, ['y'])) throw new MathError('To graph in terms of y, write x = …');
    badFree(c.uses, ['x'], 'parametric or polar graphs');
    throw new MathError('Add y = or another equation to graph this');
  }

  for (const it of items) {
    if (it.type === 'note') { out.set(it.id, { kind: 'note' }); continue; }
    if (it.type === 'table') { out.set(it.id, tableResult(it)); continue; }
    const p = P.get(it.id);
    if (!p || p.empty) { out.set(it.id, { kind: 'empty' }); continue; }
    if (p.err) { out.set(it.id, { kind: 'error', error: p.err.message }); continue; }
    try { out.set(it.id, classify(it, p)); }
    catch (e) {
      if (e instanceof MathError) out.set(it.id, { kind: 'error', error: e.message, missing: e.data.missing });
      else { console.error(e); out.set(it.id, { kind: 'error', error: 'Something went wrong with this line' }); }
    }
  }

  function tableResult(it) {
    const cols = it.columns, colErr = [], computed = [], vals = [];
    cols.forEach((c, k) => {
      try {
        const h = (c.header || '').trim();
        if (!h) throw new MathError('Name this column, like x₁');
        const st = parseCached(h);
        if (st.kind !== 'expr') throw new MathError('Column headers are names like y₁ or expressions like x₁²');
        const n = st.terms[0];
        if (n.t === 'id' && !RESERVED.has(n.name)) {
          const d = M.defs.get(n.name);
          if (d && d.kind === 'dup') throw new MathError(`${disp(n.name)} is defined more than once`);
          vals[k] = M.getVar(n.name);
        } else {
          if (k === 0) throw new MathError('The first column needs a name, like x₁');
          const cc = M.top(n);
          if (cc.uses.size) throw new MathError('Use the first column\'s name instead of x');
          const v = cc.c(mkEnv(), []);
          vals[k] = isNum(v) ? [v] : v;
          computed[k] = vals[k].map(x => fmtNum(x, 6));
        }
      } catch (e) {
        colErr[k] = e instanceof MathError ? e.message : 'Something went wrong';
        if (!(e instanceof MathError)) console.error(e);
      }
    });
    const draws = [];
    const xs = vals[0];
    for (let k = 1; k < cols.length; k++) {
      if (!xs || !vals[k]) continue;
      const pts = [];
      const n = Math.min(xs.length, vals[k].length);
      for (let i = 0; i < n; i++) if (isFinite(xs[i]) && isFinite(vals[k][i])) pts.push([xs[i], vals[k][i]]);
      draws.push({ type: 'points', pts, col: k, lines: !!cols[k].lines });
    }
    return { kind: 'table', draws, colErr, computed };
  }

  return { results: out, model: M };
}

      let best = 'half', bd = Infinity;
      for (const k in sn) { const d = Math.abs(sn[k] - cur); if (d < bd) { bd = d; best = k; } }
      prefs.sheet = best;
    }
    sheetH = null; layout(); store.set('prefs', prefs);
  };
  for (const el of [$('#grip'), $('#phead')]) {
    el.addEventListener('pointerdown', start); el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  }
})();
new ResizeObserver(() => resizeCanvas()).observe(stage);
window.addEventListener('resize', () => layout());
wideMQ.addEventListener('change', () => layout());

/* ================= drawers & settings ================= */
const scrim = $('#scrim');
function openDrawer(el) { closePop(); blurActive(); el.classList.add('open'); el.setAttribute('aria-hidden', 'false'); scrim.hidden = false; }
function closeDrawers() { $$('.drawer').forEach(d => { d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); }); scrim.hidden = true; }
scrim.addEventListener('click', closeDrawers);
$$('[data-close]').forEach(b => b.addEventListener('click', closeDrawers));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePop(); closeDrawers(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.target.closest('textarea')) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
});
function dateStr(t) {
  const d = new Date(t), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
function renderGraphs() {
  $('#titleIn').value = G.title;
  const gl = $('#gList'); gl.innerHTML = '';
  const idx = graphsIndex();
  if (!idx.length) gl.innerHTML = '<p class="note">No saved graphs yet.</p>';
  for (const e of idx) {
    const row = h('div', { class: 'grow' });
    const b = h('button', { class: 'gitem' + (e.id === G.id ? ' cur' : '') }, `<span class="gt">${esc(e.title)}<span class="gm">${esc(e.first || '')}</span></span><span class="gd">${esc(dateStr(e.updated))}</span>`);
    b.addEventListener('click', () => { openGraph(e.id); closeDrawers(); });
    const del = h('button', { class: 'gdel', 'aria-label': `Delete ${e.title}` }, ICON.del);
    del.addEventListener('click', () => deleteGraph(e.id));
    row.append(b, del);
    gl.appendChild(row);
  }
  const ex = $('#exList'); ex.innerHTML = '';
  for (const [name, make] of EXAMPLES) {
    const b = h('button', { class: 'gitem' }, `<span class="gt">${esc(name)}</span>`);
    b.addEventListener('click', () => { saveNow(); setGraph(make()); saveNow(); closeDrawers(); toast(`Opened “${name}” as a new graph`); });
    ex.appendChild(b);
  }
}
function openGraph(id) {
  if (id === G.id) return;
  saveNow();
  const g = store.get('g.' + id);
  if (g) setGraph(g);
}
function setGraph(g) {
  stopAllPlay();
  G = normalize(g); V = G.view;
  undoStack = []; redoStack = []; sel = null; trace = null; pins = []; poiKey = '';
  buildList(); reanalyze(); updateTitle(); commit();
  if (W) render();
}
function updateTitle() { $('#gTitle').textContent = G.title || 'Untitled graph'; document.title = (G.title ? G.title + ' · ' : '') + 'Domos'; }
$('#bMenu').addEventListener('click', () => { renderGraphs(); openDrawer($('#drawer')); });
$('#gTitle').addEventListener('click', () => { renderGraphs(); openDrawer($('#drawer')); });
$('#titleIn').addEventListener('input', e => { G.title = e.target.value; updateTitle(); saveSoon(); });
$('#bNew').addEventListener('click', () => { saveNow(); setGraph(newGraph('Untitled graph')); saveNow(); closeDrawers(); focusItem(G.items[0].id, true); });
$('#bDup').addEventListener('click', () => {
  saveNow(); const c = JSON.parse(JSON.stringify(serial(G))); c.id = nid(); c.title = (G.title || 'Untitled graph') + ' copy';
  setGraph(c); saveNow(); closeDrawers(); toast('Made a copy');
});
function deleteGraph(id) {
  if (id === G.id) saveNow();
  const data = store.get('g.' + id), idx0 = graphsIndex(), entry = idx0.find(x => x.id === id);
  if (!data) return;
  const wasCurrent = id === G.id;
  store.del('g.' + id);
  const idx = idx0.filter(x => x.id !== id); store.set('index', idx);
  if (wasCurrent) { const next = idx[0] && store.get('g.' + idx[0].id); setGraph(next || newGraph('Untitled graph')); if (!next) saveNow(); }
  renderGraphs();
  toast(`Deleted “${data.title || 'Untitled graph'}”`, {
    label: 'Undo', fn: () => {
      store.set('g.' + id, data);
      const cur = graphsIndex().filter(x => x.id !== id);
      cur.unshift(entry || { id, title: data.title, updated: data.updated, first: '' });
      cur.sort((a, b) => b.updated - a.updated); store.set('index', cur);
      if (wasCurrent) { saveNow(); setGraph(data); saveNow(); }
      renderGraphs();
    },
  });
}
function renderSettings() {
  $$('#themeSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === prefs.theme));
  $$('#angSeg button').forEach(b => b.classList.toggle('on', (b.dataset.v === 'deg') === !!G.deg));
  $$('.tog[data-g]').forEach(b => b.setAttribute('aria-checked', !!G.grid[b.dataset.g]));
  const f = v => String(Number(v.toPrecision(5)));
  $('#vXmin').value = f(IX(0)); $('#vXmax').value = f(IX(W)); $('#vYmin').value = f(IY(H)); $('#vYmax').value = f(IY(0));
  $('#bImg').hidden = inFrame;
  $('#verNote').textContent = `Domos ${VERSION}`;
  $('#bInstall').hidden = !installEvt;
}
$('#bSettings').addEventListener('click', () => { renderSettings(); openDrawer($('#settings')); });
$('#themeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; prefs.theme = b.dataset.v; store.set('prefs', prefs); applyTheme(); renderSettings(); });
$('#angSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; G.deg = b.dataset.v === 'deg'; reanalyze(); renderSettings(); commit(); });
$$('.tog[data-g]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.g; G.grid[k] = !G.grid[k]; poiKey = ''; renderSettings(); schedule(); saveSoon(); }));
$('#bVpApply').addEventListener('click', () => {
  const x0 = numOf($('#vXmin').value, NaN), x1 = numOf($('#vXmax').value, NaN), y0 = numOf($('#vYmin').value, NaN), y1 = numOf($('#vYmax').value, NaN);
  if (![x0, x1, y0, y1].every(isFinite) || x1 <= x0 || y1 <= y0) { toast('Each maximum has to be bigger than its minimum'); return; }
  Object.assign(V, { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, sx: W / (x1 - x0), sy: H / (y1 - y0) });
  schedule(); saveSoon(); toast('Viewport updated');
});
$('#bSquare').addEventListener('click', () => { const s = Math.sqrt(V.sx * V.sy); V.sx = V.sy = s; schedule(); saveSoon(); renderSettings(); });
$('#bCopy').addEventListener('click', () => {
  const code = JSON.stringify(serial(G));
  const ta = $('#codeIn');
  const fallback = () => { ta.value = code; ta.focus(); ta.select(); toast('Code is selected below — copy it from there'); };
  try { navigator.clipboard.writeText(code).then(() => toast('Graph code copied'), fallback); } catch (e) { fallback(); }
});
$('#bImport').addEventListener('click', () => {
  let g; try { g = JSON.parse($('#codeIn').value); } catch (e) { toast("That doesn't look like graph code"); return; }
  if (!g || !Array.isArray(g.items)) { toast("That doesn't look like graph code"); return; }
  saveNow(); g.id = nid(); setGraph(g); saveNow(); $('#codeIn').value = ''; closeDrawers(); toast(`Opened “${G.title}”`);
});
$('#bImg').addEventListener('click', () => {
  render();
  cv.toBlob(blob => {
    if (!blob) return;
    const name = (G.title || 'graph').replace(/[^\w\- ]+/g, '').trim() || 'graph';
    const file = new File([blob], name + '.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: G.title }).catch(() => {}); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.png';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
});
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
$('#bInstall').addEventListener('click', async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) { /* ignore */ } installEvt = null; renderSettings(); });

let toastT = 0;
function toast(msg, action) {
  const t = $('#toast');
  t.textContent = msg;
  if (action) {
    const b = h('button', { class: 'tact' }, esc(action.label));
    b.addEventListener('click', () => { t.classList.remove('on'); action.fn(); });
    t.appendChild(b);
  }
  t.classList.toggle('act', !!action);
  t.classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), action ? 5000 : 2600);
}

/* ================= header buttons ================= */
$('#bAdd').addEventListener('pointerdown', e => e.preventDefault());
$('#bAdd').addEventListener('click', addMenu);
['#bUndo', '#bRedo', '#bDone', '#bKbd'].forEach(s => $(s).addEventListener('pointerdown', e => e.preventDefault()));
$('#bUndo').addEventListener('click', undo);
$('#bRedo').addEventListener('click', redo);
$('#bDone').addEventListener('click', blurActive);
$('#bKbd').addEventListener('click', () => {
  prefs.kbd = !kbdOn(); store.set('prefs', prefs);
  $('#bKbd').classList.toggle('on', kbdOn());
  $$('[data-math]').forEach(kbdMode);
  if (activeInput) { if (kbdOn()) { kbdEl.hidden = true; showKbd(); } else hideKbd(); const a = activeInput; a.blur(); setTimeout(() => a.focus(), 30); }
});
$('#bZin').addEventListener('click', () => animateZoom(1.6));
$('#bZout').addEventListener('click', () => animateZoom(1 / 1.6));
$('#bHome').addEventListener('click', () => { homeView(); schedule(); saveSoon(); });

/* ================= boot ================= */
readTheme();
$('#bKbd').classList.toggle('on', kbdOn());
const last = prefs.last && store.get('g.' + prefs.last);
setGraph(last || newGraph('Untitled graph'));
applyTheme();
saveNow();
layout();
resizeCanvas();
if ('serviceWorker' in navigator && !inFrame && location.protocol === 'https:' && window.LATTICE_SW) {
  const hadSW = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadSW || reloading) return;
    reloading = true; saveNow();
    try { sessionStorage.setItem('domos.updated', '1'); } catch (e) { /* ignore */ }
    location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  }).catch(() => {});
  try { if (sessionStorage.getItem('domos.updated')) { sessionStorage.removeItem('domos.updated'); setTimeout(() => toast(`Updated to Domos ${VERSION}`), 600); } } catch (e) { /* ignore */ }
}
})();

</script>
